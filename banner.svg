<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" width="960" height="376" role="img" aria-labelledby="title desc">
  <title id="title">harish@saveetha: Harish K</title>
  <desc id="desc">A terminal session. ./whoami prints Harish K. cat /etc/motd prints “from syscalls to the cloud”. B.Tech AI &amp; Data Science, 2025–2029, Saveetha Engineering College, Chennai. less README.md is typed at the final prompt.</desc>
  <defs>
    <clipPath id="window"><rect width="960" height="376" rx="10"/></clipPath>
  </defs>

  <style id="base">
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; white-space: pre; }
    .ink { fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .acc { fill: #3fb950; }
    .gnd { fill: #0d1117; }
    .sm  { font-size: 14px; }
    .p   { font-size: 18px; }
    .st  { font-size: 15px; }
    .name { font-size: 88px; font-weight: 700; letter-spacing: -2px; }
    .motd { font-size: 28px; font-weight: 700; }
    .cv  { transform-box: fill-box; }
  </style>

  <style id="motion">
    @keyframes t1 { from { transform: translateX(-310px); } }
    @keyframes t2 { from { transform: translateX(-365px); } }
    @keyframes t3 { from { transform: translateX(-390px); } }
    @keyframes in { from { opacity: 0; } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    .c1 { animation: t1 .6s steps(27) .2s both; }
    .c2 { animation: t2 .6s steps(32) 1.1s both; }
    .c3 { animation: t3 .6s steps(34) 2.3s both; }
    .o1 { animation: in .15s ease-out .85s both; }
    .o2 { animation: in .15s ease-out 1.8s both; }
    .o3 { animation: in .15s ease-out 1.9s both; }
    .cur { animation: blink .8s steps(1, end) 2.95s 2 both; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#window)">
    <rect width="960" height="376" class="gnd"/>

    <!-- title bar -->
    <rect width="960" height="36" fill="#161b22"/>
    <rect y="36" width="960" height="1" fill="#30363d"/>
    <text x="20" y="24" class="dim sm" xml:space="preserve">harish@saveetha: ~</text>

    <!-- $ ./whoami -->
    <text x="32" y="78" class="p" xml:space="preserve"><tspan class="acc">harish@saveetha</tspan><tspan class="dim">:~$ </tspan><tspan class="ink">./whoami</tspan></text>
    <rect class="cv gnd c1" x="342" y="60" width="310" height="26"/>
    <text x="32" y="168" class="ink name o1" xml:space="preserve">Harish K</text>

    <!-- $ cat /etc/motd -->
    <text x="32" y="214" class="p" xml:space="preserve"><tspan class="acc">harish@saveetha</tspan><tspan class="dim">:~$ </tspan><tspan class="ink">cat /etc/motd</tspan></text>
    <rect class="cv gnd c2" x="397" y="196" width="365" height="26"/>
    <text x="32" y="254" class="acc motd o2" xml:space="preserve">from syscalls to the cloud</text>
    <text x="32" y="286" class="dim p o3" xml:space="preserve">B.Tech AI &amp; Data Science · 2025–2029 · Saveetha Engineering College, Chennai</text>

    <!-- $ less README.md -->
    <text x="32" y="322" class="p" xml:space="preserve"><tspan class="acc">harish@saveetha</tspan><tspan class="dim">:~$ </tspan><tspan class="ink">less README.md</tspan><tspan class="acc cur">█</tspan></text>
    <rect class="cv gnd c3" x="422" y="304" width="390" height="26"/>

    <!-- tmux-style status bar: windows mirror the README sections -->
    <rect y="344" width="960" height="32" fill="#3fb950"/>
    <text x="20" y="365" class="gnd st" xml:space="preserve"><tspan font-weight="700">[aids-29] 0:about*</tspan>  1:stack  2:projects  3:credentials  4:telemetry  5:contact</text>
    <text x="940" y="365" class="gnd st" text-anchor="end" xml:space="preserve">Chennai, IN</text>
  </g>
  <rect x=".5" y=".5" width="959" height="375" rx="10" fill="none" stroke="#30363d"/>
</svg>
